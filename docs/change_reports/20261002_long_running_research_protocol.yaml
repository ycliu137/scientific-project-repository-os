# Change Report — long-running research protocol

task_id: "os-long-running-research-protocol"
timestamp: "2026-10-02T21:50:00Z"
repos_touched: ["scientific-project-repository-os"]
theme: "os"
why: >
  Multi-session campaigns were still one conversation away from losing their
  place. Opening a fresh session does not help unless the plan, the compact
  state, and the per-task evidence already live on disk. This adds a generic
  long_running_research_protocol: persist everything important, and keep only
  the open task in the working context. BSP, omega, covprior, and later
  feature search reuse the same layers. The task ledger remains the done-gate.
